<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chuyển đổi nhiệt độ</title>
</head>
<body>
    <h2>Chuyển đổi độ C sang độ F</h2>

    Nhập nhiệt độ (°C):
    <input type="number" id="doC">

    <button onclick="chuyenDoi()">Chuyển đổi</button>

    <p id="ketqua"></p>

    <script>
        function chuyenDoi() {
            let C = Number(document.getElementById("doC").value);

            let F = (9 / 5) * C + 32;

            document.getElementById("ketqua").innerHTML =
                "Nhiệt độ là: " + F + " °F";
        }
    </script>
</body>
</html>
