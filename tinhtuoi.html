<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h2>Chuong Tinh Tinh Tuoi</h2>
    <label for="">Nhap Vao Nam Xinh Cua Ban</label>
    <input type="number" id="namsinh">
    <br><br>
    <button onclick="tinhtuoi()">Tinh Tuoi</button>
    <p id="ketqua"></p>
        
    <script>
        //viet code javascript o day
        function tinhtuoi(){
            let yourBirth = document.getElmentById("namsinh").value;
            let namhientai = 2026;
            let tuoicuaban = namhientai - yourBirth;
            document.getElementById("ketqua").innerHTML = "Tuoi cua ban: " + tuoicuaban;
        }
    </script>
</body>
</html>
