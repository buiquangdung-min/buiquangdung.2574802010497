<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tính chỉ số BMI</title>
</head>
<body>
    <h2>Tính chỉ số BMI</h2>

    Chiều cao (m):
    <input type="number" id="chieucao" step="0.01">
    <br><br>

    Cân nặng (kg):
    <input type="number" id="cannang" step="0.1">
    <br><br>

    <button onclick="tinhBMI()">Tính BMI</button>

    <p id="ketqua"></p>

    <script>
        function tinhBMI() {
            let cao = Number(document.getElementById("chieucao").value);
            let nang = Number(document.getElementById("cannang").value);

            if (cao <= 0 || nang <= 0 ||
                document.getElementById("chieucao").value == "" ||
                document.getElementById("cannang").value == "") {

                document.getElementById("ketqua").innerHTML =
                    "Vui lòng nhập dữ liệu hợp lệ!";
                return;
            }

            let bmi = nang / (cao * cao);
            bmi = bmi.toFixed(2);

            let ketluan;

            if (bmi < 18.5) {
                ketluan = "Gầy";
            } else if (bmi < 25) {
                ketluan = "Bình thường";
            } else if (bmi < 30) {
                ketluan = "Thừa cân";
            } else {
                ketluan = "Béo phì";
            }

            document.getElementById("ketqua").innerHTML =
                "Chỉ số BMI: " + bmi +
                "<br>Kết luận: " + ketluan;
        }
    </script>
</body>
</html>
