<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Profile cá nhân</title>

    <style>
        body {
            background-color: #eaf2f8;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 350px;
            margin: 50px auto;
            padding: 25px;
            border: 2px solid #3498db;
            border-radius: 15px;
            background-color: white;
            text-align: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #3498db;
        }

        .name {
            color: #2c3e50;
            font-size: 28px;
            margin: 15px 0 5px;
        }

        .job {
            color: #3498db;
            font-size: 18px;
        }

        .intro {
            color: #555;
            line-height: 1.6;
        }

        .skills {
            list-style: none;
            padding: 0;
        }

        .skills li {
            display: inline-block;
            background-color: #d6eaf8;
            padding: 8px 12px;
            margin: 5px 2px;
            border-radius: 8px;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .btn:hover {
            background-color: #21618c;
        }
    </style>
</head>

<body>

    <div class="card">

        <img
            class="avatar"
            src="anh.jpg"
            alt="Ảnh đại diện">

        <h1 class="name">Quang Dũng</h1>

        <p class="job">Sinh viên Công nghệ thông tin</p>

        <p class="intro">
            Xin chào! Tôi là sinh viên ngành Công nghệ thông tin.
            Tôi yêu thích lập trình, khám phá công nghệ mới
            và luôn muốn học hỏi thêm kiến thức.
        </p>

        <h3>Kỹ năng của tôi</h3>

        <ul class="skills">
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>

        <a class="btn" href="mailto:example@gmail.com">
            Liên hệ
        </a>

    </div>

</body>
</html>
